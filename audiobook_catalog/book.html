<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="static/style.css">
    <title>Мои аудиокниги</title>
</head>
<body>
    <header>
        <h1 class="first-name">📖 Мои аудиокниги</h1>
    </header>

    <main>
        <div class="book-categories">
            <button class="active" data-category="favorites">⭐ Избранное</button>
            <button data-category="loved">❤️ Любимые</button>
            <button data-category="read">✅ Прослушанные</button>
        </div>

        <div class="books-container" id="booksContainer">
            <div class="empty-state">
                <p>📭 Выберите категорию для просмотра</p>
            </div>
        </div>

        <div class="navigation">
            <div class="navigation-btn">
                <a href="index.html">
                    <img src="static/img/free-icon-font-home.png" alt="Главная">
                    <span>Главная</span>
                </a>
            </div>
            <div class="navigation-btn">
                <a href="search.html">
                    <img src="static/img/free-icon-font-search.png" alt="Поиск">
                    <span>Поиск</span>
                </a>
            </div>
            <div class="navigation-btn">
                <a href="book.html">
                    <img src="static/img/free-icon-font-book.png" alt="Мои книги">
                    <span>Мои</span>
                </a>
            </div>
            <div class="navigation-btn">
                <a href="profile.html">
                    <img src="static/img/free-icon-font-profile.png" alt="Профиль">
                    <span>Профиль</span>
                </a>
            </div>
        </div>
    </main>

    <script src="script/script.js"></script>
</body>
</html>
