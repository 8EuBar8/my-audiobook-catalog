<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="static/style.css">
    <title>Аудиокнига</title>
</head>
<body>
    <main>
        <nav class="book-controls">
            <div class="bookmarks">
                <button id="favoriteButton" data-type="favorite" title="В избранное">
                    <img class="bookmarks-img" src="static/img/favourites.png" alt="Избранное">
                    <span>Избранное</span>
                </button>
            </div>
            <div class="bookmarks">
                <button id="loveButton" data-type="love" title="Любимое">
                    <img class="bookmarks-img" src="static/img/love.png" alt="Любимое">
                    <span>Любимое</span>
                </button>
            </div>
            <div class="bookmarks">
                <button id="readButton" data-type="read" title="Прослушано">
                    <img class="bookmarks-img" src="static/img/read.png" alt="Прослушано">
                    <span>Прослушано</span>
                </button>
            </div>
        </nav>

        <div class="book-info">
            <div class="book-details">
                <img src="" class="book-cover" alt="Обложка">
                <div class="book-title"></div>
                <div class="book-author"></div>
                <div class="audio-player">
                    <audio id="audioPlayer" controls preload="metadata">
                        <source src="" type="audio/mpeg">
                        Ваш браузер не поддерживает аудиоплеер
                    </audio>
                    <div class="player-controls">
                        <button id="playPauseBtn" class="player-btn">▶</button>
                        <span id="currentTime">0:00</span>
                        <input type="range" id="progressBar" value="0" step="0.01">
                        <span id="duration">0:00</span>
                        <button id="volumeBtn" class="player-btn">🔊</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="information">
            <div class="info-header">📊 Информация</div>
            <div class="info-details">
                <ul class="details-list">
                    <li>🎙️ <span id="narrator" class="list-number">-</span> <span>Чтец</span></li>
                    <li>⏱️ <span id="durationText" class="list-number">-</span> <span>Длительность</span></li>
                    <li>📅 <span id="year" class="list-number">-</span> <span>Год выпуска</span></li>
                    <li>⭐ <span id="rating" class="list-number">-</span> <span>Рейтинг</span></li>
                    <li>💬 <span id="reviews" class="list-number">-</span> <span>Отзывы</span></li>
                </ul>
            </div>
            
            <div class="book-description">
                <div class="description-header">📖 О книге</div>
                <div id="description" class="description-text"></div>
            </div>
            
            <div class="rating-section">
                <div class="rating-header">⭐ Как вам книга</div>
                <div class="stars">
                    <svg data-rating="1" viewBox="0 0 24 24" class="star">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <svg data-rating="2" viewBox="0 0 24 24" class="star">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <svg data-rating="3" viewBox="0 0 24 24" class="star">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <svg data-rating="4" viewBox="0 0 24 24" class="star">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    <svg data-rating="5" viewBox="0 0 24 24" class="star">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
            </div>

            <div class="review-section">
                <div class="review-header">💬 Оставить отзыв</div>
                <textarea placeholder="Поделитесь впечатлениями об аудиокниге..."></textarea>
                <button class="submit-review">📤 Отправить</button>
                <div class="comments-container"></div>
            </div>
        </div>

        <div class="navigation">
            <div class="navigation-btn">
                <a href="index.html">
                    <img src="static/img/free-icon-font-home.png" alt="Главная">
                    <span>Главная</span>
                </a>
            </div>
            <div class="navigation-btn">
                <a href="search.html">
                    <img src="static/img/free-icon-font-search.png" alt="Поиск">
                    <span>Поиск</span>
                </a>
            </div>
            <div class="navigation-btn">
                <a href="book.html">
                    <img src="static/img/free-icon-font-book.png" alt="Мои книги">
                    <span>Мои</span>
                </a>
            </div>
            <div class="navigation-btn">
                <a href="profile.html">
                    <img src="static/img/free-icon-font-profile.png" alt="Профиль">
                    <span>Профиль</span>
                </a>
            </div>
        </div>
    </main>
    <script src="script/script.js"></script>
</body>
</html>
